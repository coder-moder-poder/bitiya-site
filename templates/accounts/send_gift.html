{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Выберите подарок для {{ recipient.first_name|default:recipient.username }}</h2>
    
    <div class="gifts-grid">
        {% for gift in gifts %}
            <div class="gift-item">
                <img src="{{ gift.image.url }}" alt="{{ gift.name }}">
                <h3>{{ gift.name }}</h3>
                <a href="{% url 'accounts:send_gift_confirm' recipient.username gift.id %}" class="select-gift-btn">Выбрать</a>
            </div>
        {% endfor %}
    </div>
</div>

<style>
    .gifts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }
    
    .gift-item {
        text-align: center;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 16px;
        transition: transform 0.2s;
    }
    
    .gift-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .gift-item img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        margin-bottom: 10px;
    }
    
    .select-gift-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 5px 15px;
        background: #2c5e2e;
        color: white;
        border-radius: 20px;
        text-decoration: none;
    }
</style>
{% endblock %}
